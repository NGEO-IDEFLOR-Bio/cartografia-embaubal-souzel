                <dc:description>Illustration of Prorocentrum minimum (Dinoflagellate) . P. minimum is a bloom-forming planktonic species in temperate, brackish waters to tropical regions; mostly estuarine, but also neritic. Due to its small size, often lost or overlooked in field samples. Cells are active swimmers. P. minimum is a toxic species; it produces venerupin (Hepatotoxin) which has caused shellfish poisoning resulting in gastrointestinal illnesses in humans and a number of deaths.</dc:description>
