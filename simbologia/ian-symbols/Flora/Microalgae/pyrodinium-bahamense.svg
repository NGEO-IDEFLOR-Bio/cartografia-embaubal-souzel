                <dc:description>Pyrodinium bahamense, considered the sister taxon to Alexandrium, is a tropical euryhaline dinoflagellate found mainly in the Atlantic Ocean. P. bahamense is a major cause of seafood toxicity and cause of paralytic shellfish poisoning, especially in Southeast Asia. </dc:description>
