                <dc:coverage></dc:coverage>
                <dc:description><p>Hymenachne was introduced into northern Queensland, Australia in the 1970s to use in ponded pastures. It escaped cultivation a few years after its release in 1988. It is spreading throughout the tropical wetlands of northern Australia and is most common in the coastal wetlands of northern Queensland and the Northern Territory.</p></dc:description>
