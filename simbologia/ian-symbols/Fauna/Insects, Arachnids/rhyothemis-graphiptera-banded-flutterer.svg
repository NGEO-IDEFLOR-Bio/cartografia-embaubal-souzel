                <dc:description>The banded flutterer dragonfly is found along the north and east coasts of Australia as well as Indonesia, Papua New Guinea and New Caledonia. They prefer still or slow-running waters, and glide or flutter their wings slowly. They can change speed and direction suddenly when flight.</dc:description>
