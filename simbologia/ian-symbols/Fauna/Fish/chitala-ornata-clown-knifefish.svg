                <dc:coverage></dc:coverage>
                <dc:description>The species, also known commonly as a clown featherback fish, occurs in Thailand, Lao PDR, Viet Nam, and Cambodia. It has been introduced to Myanmar and the Philippines for aquaculture. Juveniles are popular in the aquarium trade and large fish are popular for public aquaria. In some parts of the Philippines, its introduction is wreaking havoc on the local fishing industry.</dc:description>
