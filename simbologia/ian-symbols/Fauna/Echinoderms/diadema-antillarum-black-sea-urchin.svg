                </dc:subject>
                <dc:coverage></dc:coverage>
                <dc:description>The black sea urchin, also called a long-spined sea urchin, is the most abundant and important herbivore on the coral reefs of the western Atlantic and Caribbean basin. When the population of these sea urchins is at a healthy level, they are the main grazers which prevent algae overgrowth of the reef.</dc:description>
