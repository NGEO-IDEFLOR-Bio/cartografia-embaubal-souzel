                <dc:coverage></dc:coverage>
                <dc:description><p>A waterbird species found in coastal northern Australia. The adult Magpie goose has black and white feathers, a long neck and a cranial knob (smaller in females). They also have orange legs with partly webbed feet, and a red beak with a white hook on the end which assists them in probing for food. The Northern Territory holds the largest populations and breeding areas of the Magpie goose with an estimated population of over 2 million individuals.</p></dc:description>
