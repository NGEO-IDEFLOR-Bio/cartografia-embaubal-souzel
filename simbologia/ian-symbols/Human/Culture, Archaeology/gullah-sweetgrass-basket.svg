                <dc:description><p>One of the oldest handcrafts of African origin in the United States is the hand-woven winnowing sieve, a shallow basket that was used during the Colonia Era to separate the rice seed from its chaff. Made from indigenous bulrush, sweetgrass is a strong yet supple marsh grass that thrives in the sandy soil of the coastal regions of the US South Atlantic.</p></dc:description>
