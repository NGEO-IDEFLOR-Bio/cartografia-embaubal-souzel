            <desc xmlns:ian_image_library="https://ian.umces.edu/media-library/">
                <ian_image_library:title>Palau Storyboard: 1</ian_image_library:title>
                <ian_image_library:descr>Illustration of a man talking. The Palau storyboards and symbols are a way to tell stories of old Palauan legends, or legends from nearby places (Yap, Federated States of Micronesia, etc.). These particular symbols were taken from a bai, which is a traditional village meeting house/hut that is covered in storyboards.</ian_image_library:descr>
